<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSN MASTER DASHBOARD - Stripe Theme</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: '#061b31', slate: '#50617a', ghost: '#64748d', platinum: '#ffffff',
                        porcelain: '#f8fafd', powder: '#e5edf5', stone: '#d8d6df', violet: '#533afd',
                        washed: '#b9b9f9', soft: '#8087ff', accentg: '#81b81a', vibrant: '#ff6118',
                    },
                    boxShadow: { 'stripe-xl': '0px 0px 32px 8px rgba(0, 0, 0, 0.08)', 'stripe-sm': '0px 3px 6px 0px rgba(23, 23, 23, 0.06)' },
                    borderRadius: { 'stripe-card': '6px', 'stripe-btn': '4px' },
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafd; color: #061b31; -webkit-font-smoothing: antialiased; }
        .stripe-top-bar { height: 4px; width: 100%; position: absolute; top: 0; left: 0; background: linear-gradient(90deg, rgb(114, 50, 241) 3.13%, rgb(251, 118, 250) 50%, rgb(255, 207, 94)); }

        /* --- [수정] 줄 간격 확장 및 span CSS 초기화 --- */
        #editor {
            min-height: 500px; padding: 3rem; outline: none; background: #ffffff;
            line-height: 1.7; font-size: 14pt; color: #061b31;
            border-radius: 6px; border: 1px solid #d8d6df; box-sizing: border-box; 
            word-break: break-all; overflow-wrap: break-word; position: relative;
        }
        #editor:focus { border-color: #533afd; }
        #editor span { line-height: inherit; }
        
        #editor img { max-width: 100% !important; border-radius: 4px; margin: 1rem 0; }
        #editor img.selected-img { box-shadow: 0 0 0 3px #533afd; }
        
        .admin-tab { padding: 14px 28px; font-weight: 500; cursor: pointer; color: #64748d; transition: 0.2s; border-bottom: 2px solid transparent; }
        .admin-tab.active { color: #061b31; border-bottom-color: #533afd; font-weight: 600; }
        .sub-tab-btn { padding: 8px 16px; border-radius: 4px; font-weight: 500; font-size: 13px; border: 1px solid transparent; background: transparent; color: #50617a; }
        .sub-tab-btn.active { background: #e5edf5; color: #061b31; font-weight: 600; }

        .toolbar-group { display: flex; align-items: center; gap: 4px; border-right: 1px solid #d8d6df; padding-right: 12px; margin-right: 8px; }
        .toolbar-group:last-child { border-right: none; }
        .toolbar-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: #50617a; cursor: pointer; }
        .toolbar-btn:hover { background: #e5edf5; color: #061b31; }
        .toolbar-btn.active { background: #e5edf5; color: #533afd; } 
        
        .font-size-box { display: flex; align-items: center; background: transparent; padding: 0 4px; height: 32px; position: relative; }
        .font-size-input { width: 45px; border: 1px solid transparent; outline: none; font-weight: 600; text-align: center; font-size: 14px; background: transparent; color: #061b31; border-radius: 4px; }
        .font-size-input:focus { background: white; border-color: #d8d6df; }
        .font-size-input::-webkit-outer-spin-button, .font-size-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        #font-size-popup { display: none; position: absolute; top: 100%; left: 0; z-index: 100; background: #ffffff; border: 1px solid #e5edf5; border-radius: 6px; box-shadow: 0px 10px 30px rgba(0,0,0,0.1); width: 65px; padding: 4px 0; }
        #font-size-popup.show { display: block; }
        .font-size-item { padding: 6px 0; font-size: 13px; cursor: pointer; text-align: center; }
        .font-size-item:hover { background-color: #f8fafd; }

        .color-palette-wrap { position: relative; display: flex; align-items: center; gap: 4px; }
        .color-preview { width: 20px; height: 20px; border-radius: 3px; border: 1px solid #d8d6df; cursor: pointer; }
        #color-popup { display: none; position: absolute; top: 100%; left: 0; z-index: 110; background: #ffffff; border: 1px solid #e5edf5; border-radius: 6px; box-shadow: 0px 10px 30px rgba(0,0,0,0.1); padding: 12px; width: 260px; }
        #color-popup.show { display: block; }
        .color-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; margin-bottom: 10px; }
        .color-cell { width: 100%; aspect-ratio: 1; cursor: pointer; border: 1px solid rgba(0,0,0,0.05); }
        .color-cell:hover { transform: scale(1.1); z-index: 2; }

        .stripe-input { width: 100%; padding: 12px 16px; border-radius: 4px; border: 1px solid #d8d6df; outline: none; font-size: 14px; }
        .stripe-input:focus { border-color: #533afd; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        #img-resize-overlay { display: none; position: absolute; border: 2px solid #533afd; z-index: 40; pointer-events: none; }
        .resize-handle { position: absolute; width: 10px; height: 10px; background: #ffffff; border: 2px solid #533afd; pointer-events: auto; }
        .handle-nw { top: -7px; left: -7px; cursor: nwse-resize; }
        .handle-ne { top: -7px; right: -7px; cursor: nesw-resize; }
        .handle-sw { bottom: -7px; left: -7px; cursor: nesw-resize; }
        .handle-se { bottom: -7px; right: -7px; cursor: nwse-resize; }

        #upload-progress { display: none; width: 100%; height: 4px; background: #e5edf5; border-radius: 99px; overflow: hidden; margin-top: 10px; }
        #upload-bar { width: 0%; height: 100%; background: #533afd; transition: width 0.3s; }
    </style>
</head>
<body class="p-4 md:p-10 relative">

    <div class="stripe-top-bar"></div>

    <!-- 모달창 -->
    <div id="custom-modal" class="hidden fixed inset-0 z-[9999] bg-midnight/20 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-platinum rounded-stripe-card p-8 max-w-sm w-full shadow-stripe-xl text-center border border-powder">
            <div id="modal-icon" class="mx-auto mb-4 text-violet"><i data-lucide="info" class="w-12 h-12"></i></div>
            <h3 id="modal-title" class="text-lg font-bold mb-2">알림</h3>
            <p id="modal-desc" class="text-slate text-sm mb-8 whitespace-pre-wrap"></p>
            <div id="modal-buttons" class="flex gap-3 justify-center"></div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto pt-2">
        <!-- 헤더 -->
        <div class="flex justify-between items-center mb-8 bg-platinum p-6 rounded-stripe-card shadow-stripe-sm border border-powder">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 flex items-center justify-center rounded-stripe-btn bg-violet text-platinum"><i data-lucide="shield-check" class="w-4 h-4"></i></div>
                <h1 class="text-lg font-bold">GSN Master</h1>
            </div>
            <div id="auth-status" class="hidden"><button id="logout-btn" class="px-4 py-2 border rounded-stripe-btn text-[13px] font-medium">로그아웃</button></div>
        </div>

        <!-- 로그인 -->
        <div id="login-section" class="max-w-sm mx-auto bg-platinum p-10 rounded-stripe-card shadow-stripe-xl border border-powder mt-20 fade-in">
            <h2 class="text-2xl font-light mb-8 text-center">시스템 접속</h2>
            <div class="space-y-4">
                <input type="text" id="email" placeholder="아이디" class="stripe-input">
                <input type="password" id="password" placeholder="비밀번호" class="stripe-input">
                <button id="login-btn" class="w-full bg-violet text-white py-[15px] rounded-stripe-btn font-medium shadow-sm">대시보드 접속</button>
            </div>
        </div>

        <!-- 메인 콘텐츠 -->
        <div id="admin-content" class="hidden space-y-8 fade-in">
            <div class="flex gap-6 border-b border-powder mb-6">
                <div onclick="window.switchTab('notice')" id="tab-notice" class="admin-tab active">공지사항 관리</div>
                <div onclick="window.switchTab('applicant')" id="tab-applicant" class="admin-tab">지원자 관리</div>
            </div>

            <div id="section-notice" class="space-y-6">
                <div class="bg-platinum rounded-stripe-card border border-powder shadow-stripe-sm overflow-hidden">
                    <div class="flex justify-between items-center p-2 border-b border-powder">
                        <div class="flex items-center gap-1">
                            <button onclick="window.switchNoticeSubTab('list')" id="subtab-notice-list" class="sub-tab-btn active">글 목록</button>
                            <button onclick="window.switchNoticeSubTab('write')" id="subtab-notice-write" class="sub-tab-btn">새 글 쓰기</button>
                        </div>
                    </div>
                    <div id="notice-list-filters" class="flex items-center gap-3 px-3 py-2.5">
                        <select id="manage-category-filter" onchange="window.filterNoticesByCategory(this.value)"
                            class="text-[13px] font-medium text-midnight bg-porcelain border border-powder rounded-stripe-btn px-3 py-1.5 outline-none cursor-pointer appearance-none pr-7 hover:border-violet transition"
                            style="min-width:120px; background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2350617a%22 stroke-width=%222%22><polyline points=%226 9 12 15 18 9%22/></svg>'); background-repeat: no-repeat; background-position: right 8px center;">
                            <option value="전체">전체 카테고리</option>
                            <option value="지원공고">📢 지원공고</option>
                            <option value="네트워킹">🤝 네트워킹</option>
                            <option value="일반소식">📰 일반소식</option>
                        </select>
                        <div class="w-px h-4 bg-powder flex-shrink-0"></div>
                        <div class="relative flex-1">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-ghost pointer-events-none"></i>
                            <input type="text" id="notice-search-input" oninput="window.filterNotices(this.value)"
                                placeholder="제목으로 검색..."
                                class="w-full pl-8 pr-4 py-1.5 text-[13px] bg-porcelain border border-powder rounded-stripe-btn outline-none text-midnight placeholder-ghost focus:border-violet focus:bg-white transition">
                        </div>
                    </div>
                </div>

                <div id="notice-list-container"><div id="manage-list" class="grid md:grid-cols-2 gap-4"></div></div>

                <!-- 에디터 -->
                <div id="notice-editor-container" class="hidden">
                    <div class="bg-platinum p-8 rounded-stripe-card shadow-stripe-sm border border-powder">
                        <div class="grid md:grid-cols-4 gap-4 mb-6">
                            <select id="notice-category" class="stripe-input appearance-none" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2350617a%22 stroke-width=%222%22><polyline points=%226 9 12 15 18 9%22/></svg>'); background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px;"><option value="지원공고">지원공고</option><option value="네트워킹">네트워킹</option><option value="일반소식">일반소식</option></select>
                            <input type="text" id="notice-title" placeholder="제목을 입력하세요" class="stripe-input md:col-span-3">
                        </div>

                        <!-- 툴바 -->
                        <div class="flex flex-wrap items-center gap-2 mb-4 p-2 bg-porcelain rounded-stripe-card border border-powder">
                            <div class="toolbar-group">
                                <button id="btn-bold" onmousedown="event.preventDefault(); window.toggleBold();" class="toolbar-btn"><i data-lucide="bold" class="w-4 h-4"></i></button>
                            </div>
                            
                            <div class="toolbar-group">
                                <div class="font-size-box">
                                    <input type="number" id="font-size-val" value="14" class="font-size-input" 
                                           onfocus="window.isTypingSize=true" 
                                           onblur="window.isTypingSize=false" 
                                           onkeydown="if(event.key==='Enter'){ event.preventDefault(); window.applyFontSize(this.value); this.blur(); }">
                                    <span class="text-[10px] font-bold text-slate mr-1">PT</span>
                                    <button onmousedown="event.preventDefault(); window.toggleFontSizePopup();" class="text-slate hover:text-midnight"><i data-lucide="chevron-down" class="w-3 h-3"></i></button>
                                    <div id="font-size-popup"></div>
                                </div>
                            </div>
                            
                            <div class="toolbar-group">
                                <div class="color-palette-wrap">
                                    <div id="selected-preview" class="color-preview bg-midnight" onmousedown="event.preventDefault(); window.togglePalette();"></div>
                                    <button onmousedown="event.preventDefault(); window.togglePalette();" class="text-slate hover:text-midnight"><i data-lucide="chevron-down" class="w-3 h-3"></i></button>
                                    <div id="color-popup" class="fade-in">
                                        <div class="text-[11px] font-bold text-slate mb-2 uppercase">표준 색상 (10열)</div>
                                        <div class="color-grid" id="main-colors-grid"></div>
                                        <div class="text-[11px] font-bold text-slate mb-2 uppercase">표준 팔레트</div>
                                        <div class="color-grid" id="std-colors-grid"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="toolbar-group">
                                <button onmousedown="event.preventDefault(); window.formatDoc('justifyLeft')" class="toolbar-btn"><i data-lucide="align-left" class="w-4 h-4"></i></button>
                                <button onmousedown="event.preventDefault(); window.formatDoc('justifyCenter')" class="toolbar-btn"><i data-lucide="align-center" class="w-4 h-4"></i></button>
                                <button onmousedown="event.preventDefault(); window.formatDoc('justifyRight')" class="toolbar-btn"><i data-lucide="align-right" class="w-4 h-4"></i></button>
                            </div>
                        </div>

                        <!-- 에디터 본문 -->
                        <div class="relative w-full" id="editor-container">
                            <div id="img-toolbar" class="hidden absolute z-50 bg-midnight text-white rounded p-1.5 flex items-center gap-1">
                                <button onmousedown="event.preventDefault(); window.alignImg('left');" class="p-1.5 hover:bg-slate rounded"><i data-lucide="align-left" class="w-3 h-3"></i></button>
                                <button onmousedown="event.preventDefault(); window.alignImg('center');" class="p-1.5 hover:bg-slate rounded"><i data-lucide="align-center" class="w-3 h-3"></i></button>
                                <button onmousedown="event.preventDefault(); window.alignImg('right');" class="p-1.5 hover:bg-slate rounded"><i data-lucide="align-right" class="w-3 h-3"></i></button>
                                <input type="number" id="img-width-input" class="w-12 h-6 bg-transparent text-white text-[11px] text-center border border-slate rounded outline-none" onmousedown="event.stopPropagation();" onchange="window.resizeImg(this.value + 'px')">
                                <button onmousedown="event.preventDefault(); window.deleteCurrentImg();" class="p-1.5 text-vibrant hover:bg-slate rounded"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                            </div>
                            <div id="img-resize-overlay">
                                <div class="resize-handle handle-nw" data-pos="nw"></div>
                                <div class="resize-handle handle-ne" data-pos="ne"></div>
                                <div class="resize-handle handle-sw" data-pos="sw"></div>
                                <div class="resize-handle handle-se" data-pos="se"></div>
                            </div>
                            <div id="editor" contenteditable="true"></div>
                        </div>

                        <input type="hidden" id="edit-id">

                        <!-- 하단 액션바 -->
                        <div class="flex justify-between items-center mt-6">
                            <div class="flex flex-col gap-2">
                                <label class="cursor-pointer bg-white border border-powder px-4 py-2 rounded-stripe-btn text-[13px] font-medium flex items-center gap-2">
                                    <i data-lucide="image" class="w-4 h-4"></i> 이미지 삽입
                                    <input type="file" id="image-upload" class="hidden" accept="image/*" onchange="window.handleImageUpload(this)">
                                </label>
                                <div id="upload-progress" style="display:none; width:100%; height:4px; background:#e5edf5; border-radius:99px; overflow:hidden; margin-top:4px;">
                                    <div id="upload-bar" style="width:0%; height:100%; background:#533afd; transition:width 0.3s;"></div>
                                </div>
                            </div>
                            <div class="flex gap-3">
                                <button id="cancel-edit-btn" onclick="window.cancelEdit()" class="hidden px-6 py-2 text-slate text-[13px]">취소</button>
                                <button id="save-btn" class="px-8 py-3 bg-violet text-white rounded-stripe-btn font-medium shadow-sm">공지사항 등록</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="section-applicant" class="hidden space-y-6">
                <div class="flex justify-between items-center bg-platinum p-2 rounded-stripe-card border border-powder shadow-stripe-sm">
                    <div class="flex gap-1">
                        <button onclick="window.setApplicantType('전체')" class="app-filter-btn sub-tab-btn active" id="filter-all">전체</button>
                        <button onclick="window.setApplicantType('창업자')" class="app-filter-btn sub-tab-btn" id="filter-founder">창업자</button>
                        <button onclick="window.setApplicantType('전문가')" class="app-filter-btn sub-tab-btn" id="filter-expert">전문가</button>
                    </div>
                </div>
                <div id="applicant-list" class="grid gap-4 pb-20"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";

        const firebaseConfig = { apiKey: "AIzaSyCCr3Gv_Tij97ZOyiScptXxiPnzhZ9XTYc", authDomain: "gsnetwork.firebaseapp.com", projectId: "gsnetwork", storageBucket: "gsnetwork.firebasestorage.app", messagingSenderId: "627864872176", appId: "1:627864872176:web:cafd0d1dae27097be04e35" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const editor = document.getElementById('editor');
        const appId = "gsnetwork";

        let allApplicants = [], allNotices = [], savedRange = null, inactivityTimeout;
        let noticeSearchTerm = "", noticeCategoryFilter = "전체", currentApplicantType = '전체';
        window.isTypingSize = false;
        window.activeStyle = { size: '14pt', color: '#061b31', bold: false };

        window.handleImageUpload = (input) => {
            const file = input.files[0]; if(!file) return;
            const sRef = ref(storage, `notices/${Date.now()}_${file.name}`);
            const task = uploadBytesResumable(sRef, file);
            const pArea = document.getElementById('upload-progress');
            const pBar = document.getElementById('upload-bar');
            
            pArea.style.display = 'block';
            task.on('state_changed', 
                (snap) => { pBar.style.width = (snap.bytesTransferred / snap.totalBytes) * 100 + '%'; }, 
                () => { window.showModal("실패", "업로드 중 오류 발생"); pArea.style.display = 'none'; }, 
                () => {
                    getDownloadURL(task.snapshot.ref).then((url) => {
                        window.restoreSelection();
                        document.execCommand('insertHTML', false, `<img src="${url}" style="width:100%; max-width:100%; height:auto; display:block; margin: 1rem auto;">`);
                        pArea.style.display = 'none'; pBar.style.width = '0%'; input.value = "";
                        window.saveSelection();
                    });
                }
            );
        };

        window.toggleBold = () => {
            editor.focus();
            window.restoreSelection();
            document.execCommand('bold', false, null);
            window.activeStyle.bold = document.queryCommandState('bold');
            window.saveSelection();
            window.trackSelection();
        };

        window.applyFontSize = (val) => {
            if (!val) return;
            window.activeStyle.size = val + 'pt';
            document.getElementById('font-size-val').value = val;
            editor.focus();
            window.restoreSelection();
            const sel = window.getSelection();
            if (sel.rangeCount && !sel.getRangeAt(0).collapsed) {
                editor.focus();
                window.restoreSelection();
                document.execCommand('fontSize', false, '7');
                editor.querySelectorAll('font[size="7"]').forEach(el => {
                    const span = document.createElement('span');
                    span.style.fontSize = val + 'pt';
                    if (window.activeStyle.bold) span.style.fontWeight = 'bold';
                    span.innerHTML = el.innerHTML;
                    el.parentNode.replaceChild(span, el);
                });
                window.saveSelection();
            } else {
                applyActiveStyleToCursor();
            }
            document.getElementById('font-size-popup').classList.remove('show');
        };

        window.applyColor = (color) => {
            window.activeStyle.color = color;
            document.getElementById('selected-preview').style.background = color;
            const sel = window.getSelection();
            if (sel.rangeCount && !sel.getRangeAt(0).collapsed) {
                editor.focus();
                window.restoreSelection();
                document.execCommand('styleWithCSS', false, true);
                document.execCommand('foreColor', false, color);
                window.saveSelection();
            } else {
                applyActiveStyleToCursor();
            }
            document.getElementById('color-popup').classList.remove('show');
        };

        window.switchTab = (t) => { 
            document.querySelectorAll('.admin-tab').forEach(el=>el.classList.remove('active')); 
            document.getElementById('tab-'+t).classList.add('active'); 
            document.getElementById('section-notice').classList.toggle('hidden', t!=='notice'); 
            document.getElementById('section-applicant').classList.toggle('hidden', t!=='applicant'); 
        };

        window.switchNoticeSubTab = (t) => { 
            document.querySelectorAll('.sub-tab-btn:not(.app-filter-btn)').forEach(el=>el.classList.remove('active')); 
            document.getElementById('subtab-notice-'+t).classList.add('active'); 
            document.getElementById('notice-list-container').classList.toggle('hidden', t!=='list'); 
            document.getElementById('notice-editor-container').classList.toggle('hidden', t!=='write'); 
            document.getElementById('notice-list-filters').classList.toggle('hidden', t!=='list');
            if (t === 'write') {
                document.getElementById('cancel-edit-btn').classList.remove('hidden');
            } else {
                document.getElementById('cancel-edit-btn').classList.add('hidden');
            }
        };

        window.filterNotices = (val) => { noticeSearchTerm = val.toLowerCase().trim(); renderNotices(); };
        window.filterNoticesByCategory = (val) => { noticeCategoryFilter = val; renderNotices(); };

        window.formatDoc = (cmd, val = null) => { 
            editor.focus(); 
            window.restoreSelection(); 
            document.execCommand(cmd, false, val); 
            window.saveSelection(); 
            window.trackSelection(); 
        };

        window.saveSelection = () => {
            const sel = window.getSelection();
            if (sel.rangeCount > 0 && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                savedRange = sel.getRangeAt(0).cloneRange();
            }
        };
        window.restoreSelection = () => { if (savedRange) { const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(savedRange); } else { editor.focus(); } };

        window.trackSelection = () => {
            if (document.activeElement !== editor) return;
            window.saveSelection();
            const node = window.getSelection().anchorNode?.parentElement;
            if (node && editor.contains(node)) {
                const s = window.getComputedStyle(node);
                const pt = Math.round(parseFloat(s.fontSize) * 0.75);
                if (!window.isTypingSize) document.getElementById('font-size-val').value = pt;
                document.getElementById('btn-bold').classList.toggle('active', document.queryCommandState('bold'));
                document.getElementById('selected-preview').style.background = s.color;
            }
        };

        window.initFontSizePopup = () => {
            const list = [8, 10, 11, 12, 14, 16, 18, 20, 24, 32, 48, 72];
            document.getElementById('font-size-popup').innerHTML = list.map(s => `<div class="font-size-item" onmousedown="event.preventDefault();" onclick="window.applyFontSize(${s})">${s}pt</div>`).join('');
        };
        window.toggleFontSizePopup = () => { document.getElementById('font-size-popup').classList.toggle('show'); document.getElementById('color-popup').classList.remove('show'); };
        window.togglePalette = () => { document.getElementById('color-popup').classList.toggle('show'); document.getElementById('font-size-popup').classList.remove('show'); };

        window.initPalette = () => {
            const colors = [
                '#ffffff','#000000','#eeece1','#1f497d','#4f81bd','#c0504d','#9bbb59','#8064a2','#4bacc6','#f79646',
                '#f2f2f2','#7f7f7f','#ddd9c3','#c6d9f0','#dbe5f1','#f2dbdb','#ebf1dd','#e5e0ec','#dbeef3','#fde9d9',
                '#d8d8d8','#595959','#c4bd97','#8db3e2','#b8cce4','#e5b9b7','#d7e3bc','#ccc1d9','#b7dde8','#fbd5b5',
                '#bfbfbf','#3f3f3f','#938953','#548dd4','#95b3d7','#d99694','#c3d69b','#b2a1c7','#92cddc','#fac08f',
                '#a5a5a5','#262626','#494429','#17365d','#366092','#953734','#76923c','#5f497a','#31859b','#e36c09'
            ];
            const stds = ['#c00000','#ff0000','#ffc000','#ffff00','#92d050','#00b050','#00b0f0','#0070c0','#002060','#7030a0'];
            const grid = document.getElementById('main-colors-grid'); grid.innerHTML = '';
            colors.forEach(c => { const d = document.createElement('div'); d.className='color-cell'; d.style.background=c; d.onmousedown=(e)=>e.preventDefault(); d.onclick=()=>window.applyColor(c); grid.appendChild(d); });
            const sGrid = document.getElementById('std-colors-grid'); sGrid.innerHTML = '';
            stds.forEach(c => { const d = document.createElement('div'); d.className='color-cell'; d.style.background=c; d.onmousedown=(e)=>e.preventDefault(); d.onclick=()=>window.applyColor(c); sGrid.appendChild(d); });
        };

        window.processSubmit = async () => {
            const btn = document.getElementById('save-btn');
            const t = document.getElementById('notice-title').value.trim();
            const co = editor.innerText.trim();
            
            if (!t) return window.showModal("안내", "제목을 입력하세요.");
            if (!co) return window.showModal("안내", "내용을 입력하세요.");

            if(await window.showModal("저장", "작성하신 공지사항을 저장하시겠습니까?", "confirm")){
                btn.disabled = true;
                btn.innerText = "저장 중...";

                const d = { title: t, category: document.getElementById('notice-category').value, content: editor.innerHTML, date: new Date().toLocaleDateString('ko-KR') };
                const eid = document.getElementById('edit-id').value;
                try {
                    if (eid) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notices', eid), { ...d, updatedAt: serverTimestamp() });
                    else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'notices'), { ...d, createdAt: serverTimestamp() });
                    
                    await new Promise(resolve => setTimeout(resolve, 100)); 
                    await window.showModal("알림", "저장되었습니다.");
                    window.resetForm();
                    window.switchNoticeSubTab('list');
                } catch(e) { 
                    window.showModal("오류", "저장 실패"); 
                } finally {
                    btn.disabled = false;
                    btn.innerText = "공지사항 등록";
                }
            }
        };

        function applyActiveStyleToCursor() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            const span = document.createElement('span');
            span.style.fontSize = window.activeStyle.size;
            span.style.color = window.activeStyle.color;
            span.style.fontWeight = window.activeStyle.bold ? 'bold' : 'normal';
            span.innerHTML = '&#8203;'; 
            range.insertNode(span);
            const newRange = document.createRange();
            newRange.setStart(span.firstChild, 1);
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);
        }

        window.showModal = (title, desc, type='alert') => {
            return new Promise(res => {
                const m=document.getElementById('custom-modal'); document.getElementById('modal-title').innerText=title; document.getElementById('modal-desc').innerText=desc;
                const bBox=document.getElementById('modal-buttons');
                if(type==='confirm'){
                    bBox.innerHTML=`<button id="btn-no" class="flex-1 border py-2 rounded-stripe-btn">취소</button><button id="btn-yes" class="flex-1 bg-violet text-white py-2 rounded-stripe-btn">확인</button>`;
                    document.getElementById('btn-no').onclick=()=>{m.classList.add('hidden'); res(false);}; document.getElementById('btn-yes').onclick=()=>{m.classList.add('hidden'); res(true);};
                } else {
                    bBox.innerHTML=`<button id="btn-ok" class="w-full bg-midnight text-white py-2 rounded-stripe-btn">확인</button>`;
                    document.getElementById('btn-ok').onclick=()=>{m.classList.add('hidden'); res(true);};
                }
                m.classList.remove('hidden'); lucide.createIcons();
            });
        };

        function renderApplicants() {
            let h = "";
            allApplicants.filter(a => currentApplicantType === '전체' || a.type === currentApplicantType).forEach((d) => {
                h += `
                    <div class="bg-white p-6 rounded-stripe-card border border-powder relative shadow-sm group hover:shadow-stripe-sm transition">
                        <div class="absolute top-6 right-6 flex items-center gap-3">
                            <span class="text-[11px] text-ghost font-medium">${d.date}</span>
                            <button onclick="window.deleteApplicant('${d.id}')" class="text-ghost hover:text-vibrant transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                        <div>
                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-stripe-btn ${d.type === '창업자' ? 'bg-powder text-violet' : 'bg-powder text-midnight'} uppercase">${d.type}</span>
                            <h3 class="text-lg font-bold mt-2 text-midnight">${d.name}</h3>
                            <p class="text-sm text-slate mt-1">${d.phone} | ${d.email}</p>
                        </div>
                        <div class="bg-porcelain p-4 rounded text-sm mt-4 whitespace-pre-wrap leading-relaxed text-midnight/80 border border-powder/50">${d.content}</div>
                    </div>`;
            });
            document.getElementById('applicant-list').innerHTML = h || '<div class="py-16 text-center text-slate text-sm font-medium">지원 내역이 없습니다.</div>';
            lucide.createIcons();
        }

        window.setApplicantType = (type) => {
            currentApplicantType = type;
            document.querySelectorAll('.app-filter-btn').forEach(btn => { btn.classList.remove('active'); });
            document.getElementById(`filter-${type === '전체' ? 'all' : (type === '창업자' ? 'founder' : 'expert')}`).classList.add('active'); renderApplicants();
        };

        window.deleteApplicant = async (id) => { if(await window.showModal("삭제", "해당 지원서를 삭제하시겠습니까?", "confirm")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'applications', id)); };
        
        function renderNotices() {
            let h = "";
            const filtered = allNotices.filter(n => {
                const matchSearch = n.title.toLowerCase().includes(noticeSearchTerm);
                const matchCat = noticeCategoryFilter === "전체" || n.category === noticeCategoryFilter;
                return matchSearch && matchCat;
            });
            filtered.forEach((n) => {
                h += `
                    <div class="bg-white p-5 rounded-stripe-card border border-powder flex justify-between items-center shadow-sm hover:shadow-stripe-sm transition group">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="text-[10px] font-bold text-violet bg-powder px-2 py-0.5 rounded mr-2 uppercase">${n.category}</span>
                            <span class="font-medium cursor-pointer truncate" onclick="window.editNotice('${n.id}')">${n.title}</span>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <button onclick="window.editNotice('${n.id}')" class="p-2 hover:bg-porcelain rounded transition text-slate"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                            <button onclick="window.deleteNotice('${n.id}')" class="p-2 hover:text-vibrant rounded transition text-slate"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>`;
            });
            document.getElementById('manage-list').innerHTML = h || '<div class="col-span-2 py-16 text-center text-slate text-sm font-medium">검색 결과가 없습니다.</div>'; lucide.createIcons();
        }

        window.editNotice = async (id) => {
            const s = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notices', id));
            if (s.exists()) {
                const d = s.data(); document.getElementById('notice-title').value = d.title; document.getElementById('notice-category').value = d.category || "지원공고"; editor.innerHTML = d.content;
                document.getElementById('edit-id').value = id; document.getElementById('cancel-edit-btn').classList.remove('hidden'); window.switchNoticeSubTab('write');
            }
        };

        window.deleteNotice = async (id) => { if(await window.showModal("삭제", "정말 삭제하시겠습니까?", "confirm")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notices', id)); };
        
        window.resetForm = () => { 
            document.getElementById('notice-title').value = ""; 
            editor.innerHTML = ""; 
            document.getElementById('edit-id').value = ""; 
            document.getElementById('cancel-edit-btn').classList.add('hidden'); 
            window.hideOverlay();
        };

        window.cancelEdit = async () => {
            if(await window.showModal("취소", "작성 중인 내용이 사라집니다. 계속하시겠습니까?", "confirm")) {
                window.resetForm();
                window.switchNoticeSubTab('list');
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden'); document.getElementById('admin-content').classList.remove('hidden'); document.getElementById('auth-status').classList.remove('hidden');
                
                window.initFontSizePopup();
                window.initPalette();
                
                const getTime = (ts) => (ts && typeof ts.toMillis === 'function') ? ts.toMillis() : 0;
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'notices'), (snap) => {
                    allNotices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    allNotices.sort((a, b) => getTime(b.createdAt) - getTime(a.createdAt));
                    renderNotices();
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'applications'), (snap) => {
                    allApplicants = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    allApplicants.sort((a, b) => getTime(b.createdAt) - getTime(a.createdAt));
                    renderApplicants();
                });
            } else {
                document.getElementById('login-section').classList.remove('hidden'); document.getElementById('admin-content').classList.add('hidden'); document.getElementById('auth-status').classList.add('hidden');
            }
            lucide.createIcons();
        });

        document.getElementById('login-btn').onclick = async () => { try { await setPersistence(auth, browserSessionPersistence); await signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value.trim()); } catch(e){ window.showModal("실패","정보를 확인하세요."); } };
        document.querySelectorAll('#email, #password').forEach(el => el.onkeyup = (e) => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });
        document.getElementById('logout-btn').onclick = () => signOut(auth);
        
        /* 이미지 리사이즈 로직 */
        let currentImg=null, isResizing=false, activeHandlePos=null, startX, startWidth;
        const imgToolbar=document.getElementById('img-toolbar'), imgOverlay=document.getElementById('img-resize-overlay'), imgWidthInput=document.getElementById('img-width-input');
        editor.addEventListener('click', (e)=>{ if(e.target.tagName==='IMG'){ if(currentImg) currentImg.classList.remove('selected-img'); currentImg=e.target; currentImg.classList.add('selected-img'); updateOverlay(); }else if(!isResizing) hideOverlay(); });
        function updateOverlay(){ if(!currentImg) return; const rect=currentImg.getBoundingClientRect(), crect=document.getElementById('editor-container').getBoundingClientRect(); const top=rect.top-crect.top, left=rect.left-crect.left; imgOverlay.style.display='block'; imgOverlay.style.top=top+'px'; imgOverlay.style.left=left+'px'; imgOverlay.style.width=rect.width+'px'; imgOverlay.style.height=rect.height+'px'; imgToolbar.classList.remove('hidden'); imgToolbar.style.top=(top-40)+'px'; imgToolbar.style.left=left+'px'; imgWidthInput.value=parseInt(currentImg.style.width||currentImg.width); }
        function hideOverlay(){ if(currentImg) currentImg.classList.remove('selected-img'); currentImg=null; imgOverlay.style.display='none'; imgToolbar.classList.add('hidden'); }
        document.querySelectorAll('.resize-handle').forEach(h=>h.addEventListener('mousedown',(e)=>{e.preventDefault(); e.stopPropagation(); isResizing=true; activeHandlePos=h.dataset.pos; startX=e.clientX; startWidth=currentImg.getBoundingClientRect().width;}));
        document.addEventListener('mousemove',(e)=>{ if(!isResizing||!currentImg) return; const dx=e.clientX-startX; let nw=(activeHandlePos==='ne'||activeHandlePos==='se')?startWidth+dx:startWidth-dx; currentImg.style.width=Math.max(50,nw)+'px'; updateOverlay(); });
        document.addEventListener('mouseup',()=>{isResizing=false;});
        window.alignImg=(t)=>{ if(!currentImg) return; currentImg.style.display='block'; currentImg.style.margin=(t==='center')?'1rem auto':(t==='left'?'1rem auto 1rem 0':'1rem 0 1rem auto'); updateOverlay(); };
        window.resizeImg=(s)=>{ if(!currentImg) return; currentImg.style.width=s; updateOverlay(); };
        window.deleteCurrentImg=()=>{ if(currentImg){ currentImg.remove(); hideOverlay(); } };
        window.hideOverlay = hideOverlay;

        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                setTimeout(() => {
                    const sel = window.getSelection();
                    if (sel.rangeCount) {
                        const node = sel.anchorNode.parentElement;
                        if (editor.contains(node) && node !== editor) {
                            node.style.fontSize = window.activeStyle.size;
                            node.style.color = window.activeStyle.color;
                            node.style.fontWeight = window.activeStyle.bold ? 'bold' : 'normal';
                        }
                    }
                }, 0);
            }
            if ((e.key === 'Backspace' || e.key === 'Delete') && currentImg) { e.preventDefault(); window.deleteCurrentImg(); }
        });

        editor.oninput = window.trackSelection;
        editor.onclick = window.trackSelection;
        editor.onkeyup = window.trackSelection;
        
        document.getElementById('save-btn').addEventListener('click', window.processSubmit);
        
        lucide.createIcons();
    </script>
</body>
</html>
