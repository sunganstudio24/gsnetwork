<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSN MASTER DASHBOARD - Stripe Theme</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Stripe Theme Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: '#061b31',
                        slate: '#50617a',
                        ghost: '#64748d',
                        platinum: '#ffffff',
                        porcelain: '#f8fafd',
                        powder: '#e5edf5',
                        stone: '#d8d6df',
                        violet: '#533afd',
                        washed: '#b9b9f9',
                        soft: '#8087ff',
                        accentg: '#81b81a',
                        vibrant: '#ff6118',
                    },
                    boxShadow: {
                        'stripe-xl': '0px 0px 32px 8px rgba(0, 0, 0, 0.08)',
                        'stripe-sm': '0px 3px 6px 0px rgba(23, 23, 23, 0.06)',
                    },
                    borderRadius: {
                        'stripe-card': '6px',
                        'stripe-btn': '4px',
                    },
                    fontFamily: {
                        sans: ['sohne-var', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    backgroundImage: {
                        'sunburst-gradient': 'linear-gradient(90deg, rgb(114, 50, 241) 3.13%, rgb(251, 118, 250) 50%, rgb(255, 207, 94))',
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* 폰트 및 기본 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', 'sohne-var', sans-serif; background-color: #f8fafd; color: #061b31; -webkit-font-smoothing: antialiased; }
        
        /* 상단 데코레이션 그라데이션 */
        .stripe-top-bar { height: 4px; width: 100%; position: absolute; top: 0; left: 0; background: var(--tw-gradient-stops, linear-gradient(90deg, rgb(114, 50, 241) 3.13%, rgb(251, 118, 250) 50%, rgb(255, 207, 94))); }

        /* 에디터 스타일 */
        #editor {
            min-height: 500px; padding: 2rem; outline: none; background: #ffffff;
            line-height: 1.6; font-size: 14px; color: #061b31;
            border-radius: 6px; border: 1px solid #d8d6df; transition: all 0.2s ease;
            box-sizing: border-box; word-break: break-all; overflow-wrap: break-word; position: relative;
        }
        #editor:focus { border-color: #533afd; box-shadow: 0 0 0 3px rgba(83, 58, 253, 0.15); }
        #editor img { max-width: 100% !important; border-radius: 4px; margin: 1rem 0; cursor: move; }
        #editor img.selected-img { box-shadow: 0 0 0 3px #533afd; }
        #editor ul { list-style-type: disc; padding-left: 1.5rem; margin: 1rem 0; }
        #editor b, #editor strong { font-weight: 600; color: inherit; }
        
        /* 탭 및 버튼 스타일 */
        .admin-tab { padding: 14px 24px; font-weight: 500; cursor: pointer; color: #64748d; transition: 0.2s; border-bottom: 2px solid transparent; }
        .admin-tab:hover { color: #061b31; }
        .admin-tab.active { color: #061b31; border-bottom-color: #533afd; font-weight: 600; }
        
        .sub-tab-btn { padding: 8px 16px; border-radius: 4px; font-weight: 500; font-size: 13px; transition: 0.2s; border: 1px solid transparent; background: transparent; color: #50617a; }
        .sub-tab-btn:hover { background: #e5edf5; color: #061b31; }
        .sub-tab-btn.active { background: #e5edf5; color: #061b31; font-weight: 600; }

        .toolbar-group { display: flex; align-items: center; gap: 4px; border-right: 1px solid #d8d6df; padding-right: 12px; margin-right: 8px; }
        .toolbar-group:last-child { border-right: none; margin-right: 0; padding-right: 0; }
        
        .toolbar-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 4px; transition: all 0.2s; color: #50617a; cursor: pointer; background: transparent; }
        .toolbar-btn:hover { background: #e5edf5; color: #061b31; }
        .toolbar-btn.active { background: #e5edf5; color: #533afd; } 
        
        .font-size-box { display: flex; align-items: center; background: transparent; padding: 0 4px; height: 32px; position: relative; }
        .font-size-input { width: 36px; border: none; outline: none; font-weight: 500; text-align: center; font-size: 14px; background: transparent; color: #061b31; }
        
        #font-size-popup { 
            display: none; position: absolute; top: calc(100% + 4px); left: 0; width: 100%; min-width: 65px;
            z-index: 100; background: #ffffff; border: 1px solid #e5edf5; border-radius: 6px; 
            box-shadow: 0px 0px 32px 8px rgba(0, 0, 0, 0.08); max-height: 250px; overflow-y: auto; padding: 4px 0;
        }
        #font-size-popup.show { display: block; }
        .font-size-item { padding: 6px 0; font-size: 13px; font-weight: 400; color: #50617a; cursor: pointer; text-align: center; }
        .font-size-item:hover { background-color: #f8fafd; color: #061b31; }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d8d6df; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748d; }

        /* 공통 인풋 스타일 */
        .stripe-input {
            width: 100%; padding: 12px 16px; border-radius: 4px; border: 1px solid #d8d6df;
            outline: none; background: #ffffff; color: #061b31; font-size: 14px; transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .stripe-input:focus { border-color: #533afd; box-shadow: 0 0 0 3px rgba(83, 58, 253, 0.15); }
        .stripe-input::placeholder { color: #64748d; font-weight: 400; }

        /* 이미지 리사이즈 핸들 */
        #img-resize-overlay { display: none; position: absolute; border: 2px solid #533afd; z-index: 40; pointer-events: none; }
        .resize-handle { position: absolute; width: 10px; height: 10px; background: #ffffff; border: 2px solid #533afd; pointer-events: auto; }
        .handle-nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .handle-ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .handle-sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .handle-se { bottom: -6px; right: -6px; cursor: nwse-resize; }

        /* 업로드 진행 바 UI */
        #upload-progress { display: none; width: 100%; height: 4px; background: #e5edf5; border-radius: 99px; overflow: hidden; margin-top: 10px; }
        #upload-bar { width: 0%; height: 100%; background: #533afd; transition: width 0.3s; }

        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-10 relative">

    <div class="stripe-top-bar"></div>

    <!-- 모달창 -->

        </div>
    </div>

    <div class="max-w-6xl mx-auto pt-2">
        <!-- 헤더 -->
        <div class="flex justify-between items-center mb-8 bg-platinum p-6 rounded-stripe-card shadow-stripe-sm border border-powder">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 flex items-center justify-center rounded-stripe-btn bg-violet text-platinum"><i data-lucide="shield-check" class="w-4 h-4"></i></div>
                <div>
                    <h1 class="text-lg font-light tracking-tight text-midnight">GSN <span class="font-semibold">Master</span></h1>
                </div>
            </div>
            <div id="auth-status" class="hidden">
                <button id="logout-btn" type="button" class="px-4 py-2 bg-transparent border border-washed text-violet hover:bg-powder rounded-stripe-btn text-[13px] font-medium transition">로그아웃</button>
            </div>
        </div>

        <!-- 로그인 섹션 -->
        <div id="login-section" class="max-w-sm mx-auto bg-platinum p-10 rounded-stripe-card shadow-stripe-xl border border-powder mt-20 fade-in">
            <h2 class="text-2xl font-light mb-8 text-center text-midnight tracking-tight">시스템 접속</h2>
            <div class="space-y-4">
                <input type="text" style="display:none" aria-hidden="true">
                <input type="password" style="display:none" aria-hidden="true">
                <div>
                    <label class="block text-[11px] font-medium text-slate uppercase tracking-widest mb-1.5">관리자 아이디</label>

                    <input type="password" id="password" placeholder="••••••••" style="-webkit-text-security: disc;" class="stripe-input">
                </div>
                <div class="pt-4">
                    <button id="login-btn" type="button" class="w-full bg-violet text-platinum py-[15px] rounded-stripe-btn font-medium hover:bg-opacity-90 transition shadow-sm">대시보드 접속</button>
                </div>

        </div>

        <!-- 관리자 콘텐츠 -->
        <div id="admin-content" class="hidden space-y-8 fade-in">
            <!-- 메인 탭 -->
            <div class="flex gap-6 border-b border-powder mb-6 px-2">
                <div onclick="window.switchTab('notice')" id="tab-notice" class="admin-tab active">공지사항 관리</div>
                <div onclick="window.switchTab('applicant')" id="tab-applicant" class="admin-tab">지원자 통합 관리</div>
            </div>

            <!-- 공지사항 섹션 -->
            <div id="section-notice" class="space-y-6">
                
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-platinum p-2 rounded-stripe-card border border-powder shadow-stripe-sm">
                    <div class="flex items-center gap-1">
                        <button onclick="window.switchNoticeSubTab('list')" id="subtab-notice-list" class="sub-tab-btn active">글 목록</button>
                        <button onclick="window.switchNoticeSubTab('write')" id="subtab-notice-write" class="sub-tab-btn">새 글 쓰기</button>
                    </div>
                    <div id="notice-list-filters" class="flex items-center gap-2 pr-2 w-full md:w-auto">
                        <select id="manage-category-filter" onchange="window.filterNoticesByCategory(this.value)" class="stripe-input py-2 text-[13px] w-auto">
                            <option value="전체">전체 카테고리</option>
                            <option value="지원공고">📢 지원공고</option>
                            <option value="네트워킹">🤝 네트워킹</option>
                            <option value="일반소식">📰 일반소식</option>
                        </select>
                        <div class="relative w-full md:w-64">
                            <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-ghost"></i>
                            <input type="text" id="notice-search-input" oninput="window.filterNotices(this.value)" placeholder="공지사항 검색..." class="stripe-input py-2 pl-9 text-[13px]">
                        </div>
                    </div>
                </div>

                <!-- 글 목록 구역 -->
                <div id="notice-list-container">
                    <div id="manage-list" class="grid md:grid-cols-2 gap-4"></div>
                </div>

                <!-- 글 쓰기 구역 -->
                <div id="notice-editor-container" class="hidden">
                    <div class="bg-platinum p-8 rounded-stripe-card shadow-stripe-sm border border-powder">
                        <div class="grid md:grid-cols-4 gap-4 mb-6">
                            <select id="notice-category" class="stripe-input">
                                <option value="지원공고">지원공고</option>
                                <option value="네트워킹">네트워킹</option>
                                <option value="일반소식">일반소식</option>
                            </select>
                            <input type="text" id="notice-title" placeholder="공지 제목을 입력하세요..." class="stripe-input md:col-span-3">
                        </div>

                        <div class="flex flex-wrap items-center gap-2 mb-4 p-2 bg-porcelain rounded-stripe-card border border-powder">
                            <div class="toolbar-group">
                                <button type="button" onmousedown="event.preventDefault(); window.formatDoc('bold')" class="toolbar-btn"><i data-lucide="bold" class="w-4 h-4"></i></button>
                                <button type="button" onmousedown="event.preventDefault(); window.formatDoc('insertUnorderedList')" class="toolbar-btn"><i data-lucide="list" class="w-4 h-4"></i></button>
                            </div>
                            <div class="toolbar-group">
                                <div class="font-size-box">
                                    <input type="number" id="font-size-val" value="14" class="font-size-input" onchange="window.applyFontSize(this.value)">
                                    <span class="text-[10px] text-slate ml-1 mr-1">pt</span>
                                    <button onmousedown="event.preventDefault(); window.toggleFontSizePopup();" class="text-slate hover:text-midnight transition"><i data-lucide="chevron-down" class="w-3 h-3"></i></button>
                                    <div id="font-size-popup"></div>
                                </div>
                            </div>
                            <div class="toolbar-group">
                                <button type="button" onmousedown="event.preventDefault(); window.formatDoc('justifyLeft')" class="toolbar-btn"><i data-lucide="align-left" class="w-4 h-4"></i></button>
                                <button type="button" onmousedown="event.preventDefault(); window.formatDoc('justifyCenter')" class="toolbar-btn"><i data-lucide="align-center" class="w-4 h-4"></i></button>
                                <button type="button" onmousedown="event.preventDefault(); window.formatDoc('justifyRight')" class="toolbar-btn"><i data-lucide="align-right" class="w-4 h-4"></i></button>
                            </div>
                        </div>

                                <button type="button" onmousedown="event.preventDefault(); window.alignImg('left');" class="p-1.5 hover:bg-slate rounded transition"><i data-lucide="align-left" class="w-3 h-3"></i></button>
                                <button type="button" onmousedown="event.preventDefault(); window.alignImg('center');" class="p-1.5 hover:bg-slate rounded transition"><i data-lucide="align-center" class="w-3 h-3"></i></button>
                                <button type="button" onmousedown="event.preventDefault(); window.alignImg('right');" class="p-1.5 hover:bg-slate rounded transition"><i data-lucide="align-right" class="w-3 h-3"></i></button>
                                <div class="w-px h-4 bg-slate mx-1"></div>
                                <input type="number" id="img-width-input" class="w-12 h-6 bg-transparent text-platinum text-[11px] text-center border border-slate rounded outline-none" onmousedown="event.stopPropagation();" onchange="window.resizeImg(this.value + 'px')">
                                <div class="w-px h-4 bg-slate mx-1"></div>
                                <button type="button" onmousedown="event.preventDefault(); window.deleteCurrentImg();" class="p-1.5 text-vibrant hover:bg-slate rounded transition"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                            </div>
                            <div id="img-resize-overlay"><div class="resize-handle handle-nw" data-pos="nw"></div><div class="resize-handle handle-ne" data-pos="ne"></div><div class="resize-handle handle-sw" data-pos="sw"></div><div class="resize-handle handle-se" data-pos="se"></div></div>
                            <div id="editor" contenteditable="true"></div>
                        </div>
                        
                        <input type="hidden" id="edit-id">
                        
                        <div class="flex justify-between items-center mt-6 pt-6 border-t border-powder">
                            <!-- 우측 하단 유틸리티 (이미지 업로드) -->
                            <div class="flex flex-col gap-2">
                                <label class="cursor-pointer bg-porcelain border border-powder text-midnight px-4 py-2 rounded-stripe-btn text-[13px] font-medium hover:bg-powder transition-all flex items-center gap-2 max-w-max">
                                    <i data-lucide="image" class="w-4 h-4"></i> 이미지 삽입
                                    <input type="file" id="image-upload" class="hidden" accept="image/*" onchange="window.handleImageUpload(this)">
                                </label>
                                <div id="upload-progress"><div id="upload-bar"></div></div>
                            </div>
                            
                            <!-- 액션 버튼 -->
                            <div class="flex gap-3">
                                <button id="cancel-edit-btn" onclick="window.cancelEdit()" type="button" class="hidden px-6 py-2 bg-transparent text-midnight text-[13px] font-medium hover:text-slate transition">취소</button>
                                <button id="save-btn" type="button" class="px-8 py-[10.5px] bg-violet text-platinum rounded-stripe-btn text-[14px] font-medium shadow-sm hover:bg-opacity-90 transition">공지사항 등록</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 지원자 관리 구역 -->
            <div id="section-applicant" class="hidden space-y-6">

                    <div class="flex gap-1">
                        <button onclick="window.setApplicantType('전체')" class="app-filter-btn sub-tab-btn active" id="filter-all">전체</button>
                        <button onclick="window.setApplicantType('창업자')" class="app-filter-btn sub-tab-btn" id="filter-founder">창업자</button>
                        <button onclick="window.setApplicantType('전문가')" class="app-filter-btn sub-tab-btn" id="filter-expert">전문가</button>

                </div>

            </div>
        </div>

    <!-- ========================================== -->
    <!-- ⚙️ 엔진 구역 (이전 코드에서 100% 동일하게 유지됨) -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCr3Gv_Tij97ZOyiScptXxiPnzhZ9XTYc",
            authDomain: "gsnetwork.firebaseapp.com",
            projectId: "gsnetwork",
            storageBucket: "gsnetwork.firebasestorage.app",
            messagingSenderId: "627864872176",
            appId: "1:627864872176:web:cafd0d1dae27097be04e35"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app); 
        const appId = "gsnetwork"; 
        const editor = document.getElementById('editor');

        let allApplicants = [];
        let allNotices = [];
        let noticeSearchTerm = ""; 
        let noticeCategoryFilter = "전체"; 
        let currentApplicantType = '전체';
        let savedRange = null;
        let inactivityTimeout; 
        window.isFormatting = false;

        /* --- [신규 기능] 이미지 직접 업로드 --- */
        window.handleImageUpload = (input) => {
            const file = input.files[0];
            if (!file) return;
            const storageRef = ref(storage, `notices/${Date.now()}_${file.name}`);
            const uploadTask = uploadBytesResumable(storageRef, file);
            const progressArea = document.getElementById('upload-progress');
            const progressBar = document.getElementById('upload-bar');

            progressArea.style.display = 'block';
            uploadTask.on('state_changed', 
                (snap) => { progressBar.style.width = (snap.bytesTransferred / snap.totalBytes) * 100 + '%'; }, 
                () => { window.showModal("실패", "업로드 중 오류 발생"); progressArea.style.display = 'none'; }, 
                () => {
                    getDownloadURL(uploadTask.snapshot.ref).then((url) => {
                        window.restoreSelection();
                        document.execCommand('insertHTML', false, `<img src="${url}" style="width:100%; max-width:100%; height:auto; display:block; margin: 1rem auto;">`);
                        progressArea.style.display = 'none'; progressBar.style.width = '0%'; input.value = "";
                        window.saveSelection();
                    });
                }
            );
        };

        /* --- 보안 기능: 30분 미활동 자동 로그아웃 --- */
        const resetTimer = () => {
            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(async () => {
                if (auth.currentUser) { await signOut(auth); window.showModal("자동 로그아웃", "보안을 위해 30분간 활동이 없어 로그아웃되었습니다."); }
            }, 1000 * 60 * 30);
        };

        /* --- 로그인 처리 --- */
        const executeLogin = async () => {
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('password').value.trim();
            try { 
                await setPersistence(auth, browserSessionPersistence);
                await signInWithEmailAndPassword(auth, e, p); 
            } catch (err) { window.showModal("실패", "계정 정보가 일치하지 않습니다."); }
        };

        document.getElementById('login-btn').onclick = executeLogin;
        document.querySelectorAll('#email, #password').forEach(el => el.onkeyup = (e) => { if (e.key === 'Enter') executeLogin(); });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                document.getElementById('auth-status').classList.remove('hidden');
                window.initFontSizePopup();
                ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(n => document.addEventListener(n, resetTimer));
                resetTimer();
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'notices'), orderBy("createdAt", "desc")), (snap) => {
                    allNotices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderNotices();
                });
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'applications'), orderBy("createdAt", "desc")), (snap) => {
                    allApplicants = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderApplicants();
                });
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-content').classList.add('hidden');
                document.getElementById('auth-status').classList.add('hidden');
                clearTimeout(inactivityTimeout);
            }
            lucide.createIcons();
        });

        /* --- 커스텀 모달 제어 --- */
        window.showModal = (title, desc, type = 'alert') => {
            return new Promise((resolve) => {
                const m = document.getElementById('custom-modal');
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-desc').innerText = desc;
                const btnBox = document.getElementById('modal-buttons');
                const iconBox = document.getElementById('modal-icon');

                if (type === 'confirm') {
                    iconBox.className = "w-12 h-12 bg-red-50 text-vibrant flex items-center justify-center mx-auto mb-4 rounded-full";
                    iconBox.innerHTML = '<i data-lucide="help-circle"></i>';
                    btnBox.innerHTML = `<button id="btn-no" class="flex-1 border border-powder text-midnight py-2 rounded-stripe-btn text-[13px] font-medium hover:bg-porcelain transition">취소</button><button id="btn-yes" class="flex-1 bg-vibrant text-platinum py-2 rounded-stripe-btn text-[13px] font-medium shadow-sm hover:bg-opacity-90 transition">확인</button>`;
                    document.getElementById('btn-no').onclick = () => { m.classList.add('hidden'); resolve(false); };
                    document.getElementById('btn-yes').onclick = () => { m.classList.add('hidden'); resolve(true); };
                } else {
                    iconBox.className = "w-12 h-12 bg-powder text-violet flex items-center justify-center mx-auto mb-4 rounded-full";
                    iconBox.innerHTML = '<i data-lucide="info"></i>';
                    btnBox.innerHTML = `<button id="btn-ok" class="w-full bg-midnight text-platinum py-2 rounded-stripe-btn text-[13px] font-medium shadow-sm hover:bg-opacity-90 transition">확인</button>`;
                    document.getElementById('btn-ok').onclick = () => { m.classList.add('hidden'); resolve(true); };
                }
                lucide.createIcons(); m.classList.remove('hidden');
            });
        };

        /* --- UI 및 데이터 렌더링 --- */
        window.switchTab = (t) => { 
            document.querySelectorAll('.admin-tab').forEach(el => el.classList.remove('active')); 
            document.getElementById('tab-'+t).classList.add('active'); 
            document.getElementById('section-notice').classList.toggle('hidden', t !== 'notice'); 
            document.getElementById('section-applicant').classList.toggle('hidden', t !== 'applicant'); 
        };
        window.switchNoticeSubTab = (t) => { 
            document.querySelectorAll('.sub-tab-btn:not(.app-filter-btn)').forEach(el => el.classList.remove('active')); 
            document.getElementById('subtab-notice-'+t).classList.add('active'); 
            document.getElementById('notice-list-container').classList.toggle('hidden', t !== 'list'); 
            document.getElementById('notice-editor-container').classList.toggle('hidden', t !== 'write'); 
            document.getElementById('notice-list-filters').style.visibility = t === 'list' ? 'visible' : 'hidden'; 
        };

        window.filterNotices = (val) => { noticeSearchTerm = val.toLowerCase().trim(); renderNotices(); };
        window.filterNoticesByCategory = (val) => { noticeCategoryFilter = val; renderNotices(); };

        function renderApplicants() {
            let h = "";
            allApplicants.filter(a => currentApplicantType === '전체' || a.type === currentApplicantType).forEach((d) => {
                h += `
                    <div class="bg-platinum rounded-stripe-card p-6 border border-powder shadow-sm flex flex-col gap-4 relative group hover:shadow-stripe-sm transition">
                        <div class="absolute top-6 right-6 flex items-center gap-3">
                            <span class="text-[11px] text-ghost font-medium tracking-wide">${d.date}</span>
                            <button onclick="window.deleteApplicant('${d.id}')" class="text-ghost hover:text-vibrant transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-stripe-btn tracking-wider ${d.type === '창업자' ? 'bg-[#e5edf5] text-[#533afd]' : 'bg-[#e5edf5] text-[#061b31]'} uppercase">${d.type}</span>
                            </div>
                            <h3 class="text-lg font-medium text-midnight mt-2">${d.name}</h3>
                            <div class="flex items-center gap-4 mt-1.5 text-[13px] text-slate">
                                <span class="flex items-center gap-1.5"><i data-lucide="phone" class="w-3.5 h-3.5"></i> ${d.phone}</span>
                                <span class="flex items-center gap-1.5"><i data-lucide="mail" class="w-3.5 h-3.5"></i> ${d.email}</span>
                            </div>
                        </div>
                        <div class="bg-porcelain p-4 rounded-stripe-btn text-[14px] text-midnight/80 border border-powder whitespace-pre-wrap leading-relaxed">${d.content}</div>
                    </div>`;
            });
            document.getElementById('applicant-list').innerHTML = h || '<div class="py-16 text-center text-slate text-sm font-medium">지원 내역이 없습니다.</div>';
            lucide.createIcons();
        }

        window.setApplicantType = (type) => {
            currentApplicantType = type;
            document.querySelectorAll('.app-filter-btn').forEach(btn => { btn.classList.remove('active'); });
            document.getElementById(`filter-${type === '전체' ? 'all' : (type === '창업자' ? 'founder' : 'expert')}`).classList.add('active'); renderApplicants();
        };

        window.deleteApplicant = async (id) => { if(await window.showModal("삭제", "해당 지원서를 삭제하시겠습니까?", "confirm")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'applications', id)); };
        
        function renderNotices() {
            let h = "";
            const filtered = allNotices.filter(n => {
                const matchSearch = n.title.toLowerCase().includes(noticeSearchTerm);
                const matchCat = noticeCategoryFilter === "전체" || n.category === noticeCategoryFilter;
                return matchSearch && matchCat;
            });
            filtered.forEach((n) => {
                h += `
                    <div class="bg-platinum p-5 rounded-stripe-card border border-powder flex flex-col md:flex-row justify-between md:items-center shadow-sm hover:shadow-stripe-sm transition group gap-4">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="text-[10px] font-semibold text-violet bg-powder px-2.5 py-1 rounded-stripe-btn tracking-wide">${n.category || '일반소식'}</span>
                            <h3 class="font-medium text-midnight text-[14px] truncate cursor-pointer hover:text-violet transition" onclick="window.editNotice('${n.id}')">${n.title}</h3>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0 md:ml-auto">
                            <span class="text-[11px] text-ghost mr-2">${n.date}</span>
                            <button onclick="window.editNotice('${n.id}')" class="w-8 h-8 flex items-center justify-center text-slate hover:bg-powder hover:text-midnight rounded-stripe-btn transition"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
                            <button onclick="window.deleteNotice('${n.id}')" class="w-8 h-8 flex items-center justify-center text-ghost hover:bg-vibrant/10 hover:text-vibrant rounded-stripe-btn transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>`;
            });
            document.getElementById('manage-list').innerHTML = h || '<div class="col-span-2 py-16 text-center text-slate text-sm font-medium">검색 결과가 없습니다.</div>'; lucide.createIcons();
        }

        /* --- [완벽 복원된 웹 에디터 기능] --- */
        window.saveSelection = () => {
            if (window.isFormatting) return;
            const sel = window.getSelection();
            if (sel.rangeCount > 0 && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                savedRange = sel.getRangeAt(0).cloneRange();
            }
        };

        window.restoreSelection = () => { if (savedRange) { const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(savedRange); } else { editor.focus(); } };

        window.trackSelection = () => {
            if (window.isFormatting || document.activeElement !== editor) return;
            window.saveSelection();
            const node = window.getSelection().anchorNode?.parentElement;
            if (node && editor.contains(node)) {
                const style = window.getComputedStyle(node);
                document.getElementById('font-size-val').value = Math.round(parseFloat(style.fontSize) * 0.75);
                document.getElementById('btn-bold').classList.toggle('active', document.queryCommandState('bold'));
            }
        };

        window.applyFontSize = (val) => {
            if (!val) return;
            window.isFormatting = true; 
            editor.focus();
            window.restoreSelection();

            const sel = window.getSelection();
            if (!sel.rangeCount) { window.isFormatting = false; return; }
            
            const range = sel.getRangeAt(0);

            if (range.collapsed) {
                const span = document.createElement('span');
                span.style.fontSize = val + 'pt';
                span.innerHTML = '&#8203;'; 
                range.insertNode(span);
                const newRange = document.createRange();
                newRange.setStart(span.firstChild, 1);
                newRange.collapse(true);
                sel.removeAllRanges();
                sel.addRange(newRange);
            } else {
                const content = range.extractContents();
                const tempDiv = document.createElement('div');
                tempDiv.appendChild(content);
                tempDiv.querySelectorAll('*').forEach(el => {
                    if (el.style) el.style.fontSize = '';
                    if (el.tagName === 'FONT') {
                        const txt = document.createTextNode(el.innerText);
                        el.parentNode.replaceChild(txt, el);
                    }
                });

                const newSpan = document.createElement('span');
                newSpan.style.fontSize = val + 'pt';
                newSpan.innerHTML = tempDiv.innerHTML;
                range.insertNode(newSpan);

                const finalRange = document.createRange();
                finalRange.selectNodeContents(newSpan);
                sel.removeAllRanges();
                sel.addRange(finalRange);
            }

            setTimeout(() => {
                window.isFormatting = false;
                window.saveSelection();
                window.trackSelection();
            }, 50);
        };

        window.formatDoc = (cmd, val = null) => { editor.focus(); window.restoreSelection(); document.execCommand(cmd, false, val); window.saveSelection(); window.trackSelection(); };

        window.initFontSizePopup = () => {
            const list = [8, 9, 10, 11, 12, 14, 16, 18, 20, 24, 32, 48, 72];
            const p = document.getElementById('font-size-popup');
            p.innerHTML = list.map(s => `<div class="font-size-item" onclick="window.applyFontSize(${s}); document.getElementById('font-size-popup').classList.remove('show');">${s}pt</div>`).join('');
        };
        window.toggleFontSizePopup = () => document.getElementById('font-size-popup').classList.toggle('show');

        /* 이미지 리사이즈 로직 유지 */
        let currentImg = null; let dragSrcEl = null; let isResizing = false; let activeHandlePos = null; let startX, startWidth;
        const imgToolbar = document.getElementById('img-toolbar'); const imgOverlay = document.getElementById('img-resize-overlay'); const imgWidthInput = document.getElementById('img-width-input');
        
        editor.addEventListener('click', (e) => { if (e.target.tagName === 'IMG') { if (currentImg) currentImg.classList.remove('selected-img'); currentImg = e.target; currentImg.classList.add('selected-img'); window.updateImgOverlay(); } else if (!isResizing) window.hideImgOverlay(); });
        window.updateImgOverlay = () => { if (!currentImg) return; const rect = currentImg.getBoundingClientRect(); const crect = document.getElementById('editor-container').getBoundingClientRect(); const top = rect.top - crect.top; const left = rect.left - crect.left; imgOverlay.style.display = 'block'; imgOverlay.style.top = top + 'px'; imgOverlay.style.left = left + 'px'; imgOverlay.style.width = rect.width + 'px'; imgOverlay.style.height = rect.height + 'px'; imgToolbar.classList.remove('hidden'); imgToolbar.style.top = (top - 40) + 'px'; imgToolbar.style.left = left + 'px'; imgWidthInput.value = parseInt(currentImg.style.width || currentImg.width + 'px'); };
        window.hideImgOverlay = () => { if (currentImg) currentImg.classList.remove('selected-img'); currentImg = null; imgOverlay.style.display = 'none'; imgToolbar.classList.add('hidden'); };
        
        document.querySelectorAll('.resize-handle').forEach(h => h.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); isResizing = true; activeHandlePos = h.getAttribute('data-pos'); startX = e.clientX; startWidth = currentImg.getBoundingClientRect().width; }));
        document.addEventListener('mousemove', (e) => { if (!isResizing || !currentImg) return; e.preventDefault(); let dx = e.clientX - startX; let nw = (activeHandlePos === 'ne' || activeHandlePos === 'se') ? startWidth + dx : startWidth - dx; nw = Math.max(50, Math.min(nw, editor.clientWidth - 64)); currentImg.style.width = nw + 'px'; currentImg.style.height = 'auto'; window.updateImgOverlay(); });
        document.addEventListener('mouseup', () => { if (isResizing) { isResizing = false; editor.focus(); window.saveSelection(); } });
        
        window.alignImg = (t) => { if (!currentImg) return; if (t === 'center') { currentImg.style.display = 'block'; currentImg.style.margin = '1.5rem auto'; } else { currentImg.style.display = 'inline-block'; currentImg.style.margin = t === 'left' ? '0.5rem 1rem 0.5rem 0' : '0.5rem 0 0.5rem 1rem'; currentImg.style.verticalAlign = 'top'; } editor.focus(); setTimeout(window.updateImgOverlay, 50); };
        window.resizeImg = (s) => { if (!currentImg) return; currentImg.style.width = s; currentImg.style.height = 'auto'; imgWidthInput.value = parseInt(s); editor.focus(); setTimeout(window.updateImgOverlay, 50); };
        window.deleteCurrentImg = () => { if (!currentImg) return; currentImg.remove(); window.hideImgOverlay(); editor.focus(); window.saveSelection(); };
        editor.addEventListener('keydown', (e) => { if ((e.key === 'Backspace' || e.key === 'Delete') && currentImg) { e.preventDefault(); window.deleteCurrentImg(); return; } });


        /* 데이터 저장 로직 */
        document.getElementById('save-btn').onclick = async () => {
            const t = document.getElementById('notice-title').value.trim();
            const co = editor.innerHTML;
            const eid = document.getElementById('edit-id').value;
            if (!t || !co || co === "<br>") return window.showModal("안내", "제목과 내용을 모두 입력하세요.");
            if(await window.showModal("저장 확인", "작성하신 공지사항을 등록하시겠습니까?", "confirm")) {
                const d = { title: t, category: document.getElementById('notice-category').value, content: co, date: new Date().toLocaleDateString('ko-KR') };
                try {
                    if (eid) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notices', eid), { ...d, updatedAt: serverTimestamp() });
                    else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'notices'), { ...d, createdAt: serverTimestamp() });
                    window.showModal("성공", "정상적으로 저장되었습니다."); window.resetForm(); window.switchNoticeSubTab('list');
                } catch(e) { window.showModal("오류", "저장 실패"); }
            }
        };

        window.editNotice = async (id) => {
            const s = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notices', id));
            if (s.exists()) {
                const d = s.data(); document.getElementById('notice-title').value = d.title; document.getElementById('notice-category').value = d.category || "지원공고"; editor.innerHTML = d.content;
                document.getElementById('edit-id').value = id; document.getElementById('cancel-edit-btn').classList.remove('hidden'); window.switchNoticeSubTab('write');
            }
        };

        window.deleteNotice = async (id) => { if(await window.showModal("삭제", "정말 삭제하시겠습니까?", "confirm")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notices', id)); };
        window.resetForm = () => { document.getElementById('notice-title').value = ""; editor.innerHTML = ""; document.getElementById('edit-id').value = ""; document.getElementById('cancel-edit-btn').classList.add('hidden'); window.hideImgOverlay(); };
        window.cancelEdit = async () => { if(await window.showModal("취소", "작성 중인 내용이 사라집니다.", "confirm")) { window.resetForm(); window.switchNoticeSubTab('list'); } };
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        editor.oninput = window.trackSelection;
        editor.onclick = window.trackSelection;
        editor.onkeyup = window.trackSelection;
        lucide.createIcons();
    </script>
</body>
</html>
